server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name code-green-systems.de;

    ssl_certificate /etc/nginx/ssl/live/code-green-systems.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/code-green-systems.de/privkey.pem;
    

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
    	return 301 https://www.code-green-systems.de$request_uri;
    }
}

services:
    postgresql:
        image: postgres
        hostname: postgres.local
        restart: always
        shm_size: 128mb
        env_file: ~/docker_data/postgres/postgres.env
        volumes:
            - ./docker/postgres/:/docker-entrypoint-initdb.d/

#    adminer:
#        image: adminer
#        restart: always
#        depends_on:
#            - postgresql
#        ports:
#            - 17080:8080

    cscs:
        build: .
        hostname: cscs.local
        restart: always
        depends_on:
            - postgresql
        volumes:
            - ~/docker_data/cscs/application.properties:/application.properties

    joomla:
        image: joomla
        hostname: joomla.local
        restart: always
        env_file: ~/docker_data/joomla/joomla.env
        volumes:
          - joomla_data:/var/www/html
    
    portainer:
        image: portainer/portainer-ce:latest
        hostname: portainer.local
        restart: always
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - portainer_data:/data

    nginx:
        image: nginx
        restart: always
        ports:
          - 80:80
          - 443:443
        volumes:
          - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
          - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            #certbot
          - ~/docker_data/acme-challenge/:/var/www/certbot/:ro
          - ~/docker_data/certbot/:/etc/nginx/ssl/:ro
    
    certbot:
        image: certbot/certbot:latest
        volumes:
          - ~/docker_data/acme-challenge/:/var/www/certbot/:rw
          - ~/docker_data/certbot/:/etc/letsencrypt/:rw

volumes:
    joomla_data:
    portainer_data:

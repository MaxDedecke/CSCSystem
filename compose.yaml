services:
    postgresql:
        image: postgres:latest
        hostname: postgres.local
        restart: always
        shm_size: 128mb
        env_file: ~/docker_data/postgres/postgres.env
        volumes:
            - ./docker/postgres/:/docker-entrypoint-initdb.d/
            - postgres_data:/var/lib/postgresql/data/

    adminer:
        image: adminer:latest
        restart: no
        depends_on:
            - postgresql
        ports:
            - 17080:8080

    cscs:
        image: cgs/cscs:latest
        build: .
        hostname: cscs.local
        restart: always
        depends_on:
            - postgresql
        volumes:
            - ~/docker_data/cscs/application.properties:/application.properties

    joomla:
        image: joomla:latest
        hostname: joomla.local
        restart: always
        env_file: ~/docker_data/joomla/joomla.env
        volumes:
          - joomla_data:/var/www/html
    
    portainer:
        image: portainer/portainer-ce:latest
        hostname: portainer.local
        restart: always
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - portainer_data:/data
    
    watchtower:
        image: containrrr/watchtower:latest
        restart: always
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        env_file: ~/docker_data/watchtower/notifications.env
        environment:
          - WATCHTOWER_CLEANUP=true
          - WATCHTOWER_SCHEDULE=0 0 3 * * *
          - WATCHTOWER_DISABLE_CONTAINERS=cscsystem-cscs-1
            # Every Day 3:00 in the night
    
            #    borgbackup:
            #image: epicdocker/borgbackup:stable
            #restart: always
            #volumes:
            #- joomla_data:/sources/joomla/:ro
            #- portainer_data:/sources/portainer/:ro
            #- postgres_data:/sources/postgres/:ro
            #- ~/docker_data/:/sources/docker_data/:ro
            #- /mnt/cgs-backup/:/cgs-backup
            #env_file: ~/docker_data/borgbackup/backup.env
  
    nginx:
        image: nginx:latest
        restart: always
        ports:
          - 80:80
          - 443:443
        volumes:
          - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
          - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            #certbot
          - ~/docker_data/acme-challenge/:/var/www/certbot/:ro
          - ~/docker_data/certbot/:/etc/nginx/ssl/:ro
    
    certbot:
        image: certbot/certbot:latest
        volumes:
          - ~/docker_data/acme-challenge/:/var/www/certbot/:rw
          - ~/docker_data/certbot/:/etc/letsencrypt/:rw

volumes:
    joomla_data:
    portainer_data:
    postgres_data:
